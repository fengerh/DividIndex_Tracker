name: 每日更新指数数据

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC；已换算为北京时间，并刻意避开整点以降低排队延迟。
    - cron: "7 10 * * 1-5"    # 北京时间 18:07 主跑
    - cron: "11 12 * * 1-5"   # 北京时间 20:11 兜底
    - cron: "13 14 * * 1-5"   # 北京时间 22:13 兜底
  workflow_dispatch:          # 允许手动触发

concurrency:
  group: dividindex-data-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 记录触发时间
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "触发事件: $EVENT_NAME"
          echo "UTC 时间: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "北京时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
      - name: 抓取中证指数数据
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python fetch_data.py
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
      - name: 失败告警
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "指数数据抓取校验失败";
            const { repo, owner } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            if (existing.data.some(i => i.title === title)) {
              console.log("已存在同标题告警 issue，跳过。");
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              body: "GitHub Actions 工作流 `update.yml` 执行失败（抓取异常或结果校验未通过）。\n\n请到 Actions 页面查看日志，必要时手动触发一次 `workflow_dispatch` 重新抓取。"
            });