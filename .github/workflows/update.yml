name: 每日更新指数数据

on:
  schedule:
    # cron 恒为 UTC（+8 为北京时间）。主触发在 Google Apps Script（北京 18:05 / 20:10），
    # 这里的 cron 作为当天最后兜底：外部服务整体失效时仍能当日更新。
    - cron: "15 14 * * 1-5"   # 北京时间 22:15 兜底
  workflow_dispatch:          # 网页手动触发 / 外部定时器 API 触发
    inputs:
      force:
        description: "1=强制重抓（跳过交易日与幂等检查，校验下限 50 条）；0=按定时逻辑（幂等 + 400 条校验）"
        type: choice
        options: ["1", "0"]
        default: "1"

concurrency:
  group: dividindex-data-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 记录触发时间
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force != '0' && '1' || '0' }}
        run: |
          echo "触发事件: $EVENT_NAME"
          echo "触发者: $ACTOR"
          echo "force 输入: ${INPUT_FORCE:-（未提供）}"
          echo "FORCE_UPDATE: $FORCE_UPDATE"
          echo "UTC 时间: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "北京时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
      - name: 抓取中证指数数据
        env:
          # 三态：外部定时器传 force=0 → 0（幂等+严格校验）；网页按钮默认 force=1 → 1（强制重抓）；
          # schedule 无 inputs → 0。见 README「触发模式对照表」。
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force != '0' && '1' || '0' }}
        run: python fetch_data.py
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
      - name: 失败告警
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "指数数据抓取校验失败";
            const { repo, owner } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            if (existing.data.some(i => i.title === title)) {
              console.log("已存在同标题告警 issue，跳过。");
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              body: "GitHub Actions 工作流 `update.yml` 执行失败（抓取异常或结果校验未通过）。\n\n请到 Actions 页面查看日志，必要时手动触发一次 `workflow_dispatch` 重新抓取。"
            });
