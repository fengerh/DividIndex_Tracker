name: 每日更新指数数据

on:
  schedule:
    - cron: "0 19 * * 1-5"    # 北京时间 19:00（使用 IANA 时区 Asia/Shanghai）
      timezone: "Asia/Shanghai"
    - cron: "0 20 * * 1-5"    # 北京时间 20:00
      timezone: "Asia/Shanghai"
    - cron: "0 21 * * 1-5"    # 北京时间 21:00 兜底再跑一次
      timezone: "Asia/Shanghai"
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 抓取中证指数数据
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python fetch_data.py
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
      - name: 失败告警
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "指数数据抓取校验失败";
            const { repo, owner } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            if (existing.data.some(i => i.title === title)) {
              console.log("已存在同标题告警 issue，跳过。");
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              body: "GitHub Actions 工作流 `update.yml` 执行失败（抓取异常或结果校验未通过）。\n\n请到 Actions 页面查看日志，必要时手动触发一次 `workflow_dispatch` 重新抓取。"
            });